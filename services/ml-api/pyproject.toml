[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ml-api"
version = "0.1.0"
description = "FastAPI Predictive & Adaptive Microservice for Plataforma de Microaprendizaje Adaptativo"
authors = ["Adaptive Microlearning Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic = ">=2.6.0,<3.0.0"
pydantic-settings = ">=2.2.0"
httpx = ">=0.27.0"
numpy = ">=1.26.0"
scikit-learn = ">=1.4.0"
scipy = ">=1.12.0"
pandas = ">=2.2.0"
pyjwt = {extras = ["crypto"], version = ">=2.8.0"}
cryptography = ">=42.0.0"
pypdf = ">=4.0.0"
python-pptx = ">=0.6.23"
python-multipart = ">=0.0.9"
asyncpg = ">=0.29.0"
google-genai = ">=2.0.0"
openai = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
mypy = ">=1.9.0"
ruff = ">=0.3.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../.."]

