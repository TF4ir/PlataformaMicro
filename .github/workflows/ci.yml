name: Continuous Integration & Release Readiness (R1.2 + R2)

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  contracts:
    name: Contracts & OpenAPI Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies for canonical schema extraction
        run: |
          python -m pip install --upgrade pip
          pip install -e services/ml-api/

      - name: Verify zero OpenAPI contract drift
        run: |
          python3 scripts/sync_openapi.py --check

  frontend:
    name: Frontend Quality & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Static Type Check
        run: npm run type-check

      - name: Non-interactive ESLint Check
        run: npm run lint
        env:
          NODE_PATH: apps/web/node_modules:node_modules

      - name: Automated Unit & Invariant Tests
        run: npm test

  backend:
    name: Backend Quality, Typing & Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plataformamicro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies & test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e services/ml-api/
          pip install ruff mypy pytest pytest-asyncio

      - name: Ruff Lint & Formatting Check
        run: |
          ruff check services/ml-api scripts/sync_openapi.py

      - name: Mypy Strict Type Check
        run: |
          mypy --config-file services/ml-api/pyproject.toml services/ml-api/app

      - name: Initialize Test Database Schema
        run: |
          which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d plataformamicro_test -f services/ml-api/tests/test_db_schema.sql

      - name: Run Backend Pytest Suite
        run: |
          pytest services/ml-api/tests
